[package]
name = "stackport"
version = "1.0.0-2"
description = "Server- und Projektübersicht für Laravel- und WordPress-Entwickler"
authors = ["StackPort contributors"]
license = "AGPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stackport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
tauri-plugin-dialog = "2"
tokio = { version = "1.54.1", features = ["process", "time", "io-util", "sync", "macros"] }
reqwest = { version = "0.13.5", features = ["json"] }
tauri-plugin-notification = "2.7.0"
sys-locale = "0.3.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Credential store for CI tokens: macOS Keychain, Windows Credential Manager,
# Secret Service (GNOME Keyring, KWallet) on Linux via zbus without libdbus
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["async-secret-service", "tokio", "crypto-rust"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
