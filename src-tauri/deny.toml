# Lizenzprüfung der Rust-Abhängigkeiten: `cargo deny check licenses`
# Erlaubt sind nur Lizenzen, die mit AGPL-3.0 vereinbar sind.

[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[licenses]
allow = [
  "AGPL-3.0-only",
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  # Mozilla root certificates (webpki-root-certs, via reqwest on Linux); permissive data license
  "CDLA-Permissive-2.0",
]
