name: Feature request
description: Suggest an idea or improvement for Hostmoor
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
      description: Your idea for a solution. Sketches or examples from other tools are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: What do you do today instead?
