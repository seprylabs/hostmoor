# On every tag (e.g. v0.3.0) builds StackPort for macOS, Windows and Linux
# and attaches the installers to a GitHub release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal build: runs on Apple Silicon and Intel (.app, .dmg)
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          # .msi and NSIS .exe
          - name: Windows
            os: windows-latest
            rust-targets: ""
            args: ""
          # .AppImage, .deb, .rpm; the oldest supported Ubuntu keeps glibc requirements low
          - name: Linux
            os: ubuntu-22.04
            rust-targets: ""
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the app checks them against the pubkey in tauri.conf.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: StackPort ${{ github.ref_name }}
          releaseBody: |
            The apps are not code-signed, so your system warns once:

            - **macOS:** after installing, run once in Terminal: `xattr -cr /Applications/StackPort.app`
            - **Windows:** SmartScreen warns about an unknown publisher. Choose “More info” → “Run anyway”.
            - **Linux:** make the AppImage executable (`chmod +x`) or install the .deb / .rpm.

            To verify a download, compare it with `SHA256SUMS.txt`:
            `shasum -a 256 -c SHA256SUMS.txt --ignore-missing` (macOS) or `sha256sum -c SHA256SUMS.txt --ignore-missing` (Linux).
          releaseDraft: false
          # Tags with a pre-release part (v1.0.0-1) become pre-releases, which the
          # updater ignores because it only reads the latest regular release
          prerelease: ${{ contains(github.ref_name, '-') }}
          # RPM rejects a hyphen in the version, so test tags (v1.0.0-1) skip it on Linux
          args: ${{ matrix.args }}${{ matrix.name == 'Linux' && contains(github.ref_name, '-') && ' --bundles appimage,deb' || '' }}
          # latest.json: Windows updates use the per-user NSIS installer instead of the .msi
          updaterJsonPreferNsis: true

  # Runs once all installers are uploaded and adds a checksum file to the release
  checksums:
    name: SHA256 checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Add SHA256SUMS.txt to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          # A rerun would otherwise include the old checksum file
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
