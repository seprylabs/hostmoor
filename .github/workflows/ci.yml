# Prüft jeden Push auf main und jeden Pull Request auf macOS, Windows und Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Ein neuer Push bricht den noch laufenden Durchlauf für denselben Branch ab
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Prüfen (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux-Bibliotheken für Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # tsc und vite build; Tauri braucht dist/ auch zum Kompilieren des Rust-Teils
      - run: npm run build

      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  audit:
    name: Sicherheitslücken in Abhängigkeiten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm audit --audit-level=moderate

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - run: cargo audit --file src-tauri/Cargo.lock
